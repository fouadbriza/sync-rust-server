<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #fafafa;
            color: #444;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #d9534f; } /* Error red */
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>404: Page Not Found</h1>
        <p>the path you're looking for doesn't exist on this server</p>
        <p><a href="/">Go Back Home</a></p>
    </div>
</body>
</html>
